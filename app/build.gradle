plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "kotlin-kapt"
}

android {
    namespace "com.tiberiptv.fire"
    compileSdk 35
    def firestickAbis = (project.findProperty("firestickAbis") ?: "")
            .split(",")
            .collect { it.trim() }
            .findAll { !it.isEmpty() }

    defaultConfig {
        applicationId "com.tiberiptv.fire"
        minSdk 25
        targetSdk 35
        versionCode 34
        versionName "0.3.1"
        if (!firestickAbis.isEmpty()) {
            ndk {
                abiFilters.addAll(firestickAbis)
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.10"
    }

    signingConfigs {
        release {
            def storePath = System.getenv("TIBER_RELEASE_STORE_FILE")
            def storePass = System.getenv("TIBER_RELEASE_STORE_PASSWORD")
            def keyAliasValue = System.getenv("TIBER_RELEASE_KEY_ALIAS")
            def keyPass = System.getenv("TIBER_RELEASE_KEY_PASSWORD")
            if (storePath && storePass && keyAliasValue && keyPass) {
                storeFile file(storePath)
                storePassword storePass
                keyAlias keyAliasValue
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def safeVersionName = variant.versionName.replaceAll("[^A-Za-z0-9._-]", "_")
            outputFileName = "tiber-iptv-${safeVersionName}-${variant.versionCode}-${variant.name}.apk"
        }
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.fragment:fragment-ktx:1.8.5"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.room:room-runtime:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "org.videolan.android:libvlc-all:3.7.0"
    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.12.2"
}
